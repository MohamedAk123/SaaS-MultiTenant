name: saas-jalon1

x-spark: &spark
  image: saas-jalon1-spark:3.5.6
  build: ./docker/spark
  environment: &spark-env
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Create .env first}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Create .env first}
    S3_ENDPOINT: http://minio:9000
    SPARK_MASTER_URL: spark://spark-master:7077
    SPARK_DAEMON_MEMORY: 384m
  volumes:
    - ./:/workspace
    - spark-events:/opt/spark/events
  networks: [bigdata]

services:
  spark-master:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:7077:7077"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/json/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker-1:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1536m", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master: {condition: service_healthy}
    ports: ["127.0.0.1:8081:8081"]
    mem_limit: 2g

  spark-worker-2:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "1536m", "--webui-port", "8081", "spark://spark-master:7077"]
    depends_on:
      spark-master: {condition: service_healthy}
    ports: ["127.0.0.1:8082:8081"]
    mem_limit: 2g

  jupyter:
    <<: *spark
    hostname: jupyter
    environment:
      <<: *spark-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Create .env first}
    command: ["python3", "-m", "jupyterlab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.root_dir=/workspace"]
    depends_on:
      spark-master: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["127.0.0.1:8888:8888", "127.0.0.1:4040:4040"]
    mem_limit: 1536m

  spark-history:
    <<: *spark
    environment:
      <<: *spark-env
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=/opt/spark/events -Dspark.history.ui.port=18080
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports: ["127.0.0.1:18080:18080"]
    mem_limit: 512m

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/var/lib/kafka/data"]
    ports: ["127.0.0.1:9092:9092"]
    networks: [bigdata]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:19092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 12

  minio:
    image: saas-jalon1-minio:2025-04-22
    build: ./docker/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    networks: [bigdata]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  bigdata:
volumes:
  kafka-data:
  minio-data:
  spark-events:
